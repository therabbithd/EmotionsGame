<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">EmotionsGame — two-dimensional physics with pooled enemy waves</title>
  <desc id="desc">A dark technical title panel with a rolling smiley at the intersection of X and Z dimensions, two Cinemachine cameras, and a spawner to pool to enemy flow.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1D2C45" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8DA2BF"/>
    </marker>
  </defs>
  <rect width="1200" height="380" rx="2" fill="#0B1220"/>
  <rect x="0" y="0" width="1200" height="380" fill="url(#grid)" opacity="0.55"/>
  <path d="M 0 340 L 1200 340" stroke="#2A3D5A" stroke-width="2"/>
  <g id="title-block" transform="translate(56 56)">
    <text x="0" y="0" fill="#4EA6FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" letter-spacing="3">UNITY 6  ·  URP  ·  PHYSICS</text>
    <text x="0" y="78" fill="#F5F7FA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="64" font-weight="700">EmotionsGame</text>
    <text x="0" y="128" fill="#D7E2F0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24">Roll through two dimensions, switch perspective,</text>
    <text x="0" y="160" fill="#D7E2F0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24">and survive pooled enemy waves.</text>
    <text x="0" y="216" fill="#8DA2BF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">6000.6.4f1 · URP · CINEMACHINE · INPUT SYSTEM · DOTWEEN</text>
    <g transform="translate(0 258)">
      <rect x="0" y="0" width="300" height="46" rx="10" fill="#13213A" stroke="#2A3D5A" stroke-width="2"/>
      <text x="20" y="30" fill="#F5F7FA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">TAB / Y  →  SWITCH AXIS</text>
    </g>
  </g>
  <g id="project-proof" transform="translate(676 48)">
    <rect x="0" y="0" width="494" height="284" rx="18" fill="#111D31" stroke="#2A3D5A" stroke-width="2"/>
    <text x="24" y="34" fill="#8DA2BF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">GAMEPLAY SYSTEM MAP</text>
    <g id="dimension-axes" transform="translate(24 52)">
      <path d="M 8 96 L 438 96" stroke="#4EA6FF" stroke-width="2" marker-end="url(#arrow)"/>
      <path d="M 223 8 L 223 176" stroke="#4EA6FF" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="446" y="102" fill="#4EA6FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">X</text>
      <text x="232" y="14" fill="#4EA6FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">Z</text>
      <circle cx="223" cy="96" r="34" fill="#0B1220" stroke="#FFD84D" stroke-width="3"/>
      <circle cx="212" cy="90" r="3.5" fill="#0B1220"/>
      <circle cx="234" cy="90" r="3.5" fill="#0B1220"/>
      <path d="M 211 105 Q 223 116 235 105" fill="none" stroke="#0B1220" stroke-width="3" stroke-linecap="round"/>
      <text x="223" y="154" fill="#F5F7FA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" text-anchor="middle">PLAYER</text>
      <g transform="translate(20 8)">
        <rect x="0" y="0" width="112" height="34" rx="8" fill="#13213A" stroke="#4EA6FF" stroke-width="2"/>
        <text x="12" y="24" fill="#D7E2F0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">CAM A · X</text>
      </g>
      <g transform="translate(314 8)">
        <rect x="0" y="0" width="112" height="34" rx="8" fill="#13213A" stroke="#4EA6FF" stroke-width="2"/>
        <text x="12" y="24" fill="#D7E2F0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">CAM B · Z</text>
      </g>
      <circle cx="378" cy="96" r="9" fill="#4EA6FF"/>
      <circle cx="70" cy="96" r="9" fill="#4EA6FF"/>
      <text x="372" y="132" fill="#8DA2BF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">ENEMY</text>
      <text x="50" y="132" fill="#8DA2BF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">SPAWN</text>
    </g>
    <g id="flow-strip" transform="translate(24 232)">
      <rect x="0" y="0" width="132" height="34" rx="8" fill="#13213A" stroke="#4EA6FF" stroke-width="2"/>
      <text x="14" y="24" fill="#D7E2F0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">SPAWNER</text>
      <path d="M 140 17 L 176 17" stroke="#8DA2BF" stroke-width="2" marker-end="url(#arrow)"/>
      <rect x="182" y="0" width="108" height="34" rx="8" fill="#13213A" stroke="#4EA6FF" stroke-width="2"/>
      <text x="196" y="24" fill="#D7E2F0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">POOL</text>
      <path d="M 296 17 L 332 17" stroke="#8DA2BF" stroke-width="2" marker-end="url(#arrow)"/>
      <rect x="338" y="0" width="108" height="34" rx="8" fill="#13213A" stroke="#FFD84D" stroke-width="2"/>
      <text x="352" y="24" fill="#FFD84D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">ENEMY</text>
    </g>
  </g>
</svg>
