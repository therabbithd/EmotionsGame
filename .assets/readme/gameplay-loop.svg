<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">EmotionsGame playable loop</title>
  <desc id="desc">Three runtime lanes showing dimension switching and camera priority, damage and player lives, and life pickups and enemy score.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1D2C45" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8DA2BF"/>
    </marker>
  </defs>
  <rect width="1200" height="560" rx="18" fill="#0B1220"/>
  <rect width="1200" height="560" rx="18" fill="url(#grid)" opacity="0.35"/>
  <g id="heading" transform="translate(56 48)">
    <text x="0" y="0" fill="#4EA6FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" letter-spacing="3">ONE PLAYABLE LOOP  ·  MOVE → SURVIVE → SCORE</text>
    <text x="0" y="44" fill="#F5F7FA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="700">Input becomes motion. Danger becomes decisions.</text>
  </g>
  <g id="move-lane" transform="translate(40 126)">
    <rect width="1120" height="116" rx="16" fill="#101B2E" stroke="#233655" stroke-width="2"/>
    <text x="22" y="50" fill="#4EA6FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700">MOVE</text>
    <path d="M 170 20 L 170 96" stroke="#233655" stroke-width="2"/>
    <g transform="translate(216 22)">
      <rect width="204" height="72" rx="12" fill="#13213A" stroke="#2A3D5A" stroke-width="2"/>
      <text x="16" y="30" fill="#F5F7FA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">TAB / Y</text>
      <text x="16" y="56" fill="#8DA2BF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">switch input</text>
    </g>
    <path d="M 424 58 L 452 58" stroke="#8DA2BF" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(456 22)">
      <rect width="204" height="72" rx="12" fill="#13213A" stroke="#2A3D5A" stroke-width="2"/>
      <text x="16" y="30" fill="#F5F7FA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">ACTIVE AXIS</text>
      <text x="16" y="56" fill="#8DA2BF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">X or Z</text>
    </g>
    <path d="M 664 58 L 692 58" stroke="#8DA2BF" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(696 22)">
      <rect width="204" height="72" rx="12" fill="#13213A" stroke="#2A3D5A" stroke-width="2"/>
      <text x="16" y="30" fill="#F5F7FA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">CAM PRIORITY</text>
      <text x="16" y="56" fill="#8DA2BF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">A or B at 10</text>
    </g>
    <path d="M 904 58 L 932 58" stroke="#8DA2BF" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(936 22)">
      <rect width="204" height="72" rx="12" fill="#172A46" stroke="#FFD84D" stroke-width="2"/>
      <text x="16" y="30" fill="#FFD84D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">WASD / STICK</text>
      <text x="16" y="56" fill="#D7E2F0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">roll + depth</text>
    </g>
  </g>
  <g id="survive-lane" transform="translate(40 258)">
    <rect width="1120" height="116" rx="16" fill="#101B2E" stroke="#233655" stroke-width="2"/>
    <text x="22" y="50" fill="#4EA6FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700">SURVIVE</text>
    <path d="M 170 20 L 170 96" stroke="#233655" stroke-width="2"/>
    <g transform="translate(216 22)">
      <rect width="204" height="72" rx="12" fill="#13213A" stroke="#2A3D5A" stroke-width="2"/>
      <text x="16" y="30" fill="#F5F7FA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">DAMAGE ZONE</text>
      <text x="16" y="56" fill="#8DA2BF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">trigger collider</text>
    </g>
    <path d="M 424 58 L 452 58" stroke="#8DA2BF" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(456 22)">
      <rect width="204" height="72" rx="12" fill="#13213A" stroke="#2A3D5A" stroke-width="2"/>
      <text x="16" y="30" fill="#F5F7FA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">DAMAGE DEALER</text>
      <text x="16" y="56" fill="#8DA2BF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">int TakeDamage</text>
    </g>
    <path d="M 664 58 L 692 58" stroke="#8DA2BF" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(696 22)">
      <rect width="204" height="72" rx="12" fill="#13213A" stroke="#2A3D5A" stroke-width="2"/>
      <text x="16" y="30" fill="#F5F7FA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">PLAYER HEALTH</text>
      <text x="16" y="56" fill="#8DA2BF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">i-frames · blink</text>
    </g>
    <path d="M 904 58 L 932 58" stroke="#8DA2BF" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(936 22)">
      <rect width="204" height="72" rx="12" fill="#172A46" stroke="#FFD84D" stroke-width="2"/>
      <text x="16" y="30" fill="#FFD84D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">DIED EVENT</text>
      <text x="16" y="56" fill="#D7E2F0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">movement off</text>
    </g>
  </g>
  <g id="reward-lane" transform="translate(40 390)">
    <rect width="1120" height="116" rx="16" fill="#101B2E" stroke="#233655" stroke-width="2"/>
    <text x="22" y="50" fill="#4EA6FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700">REWARD</text>
    <path d="M 170 20 L 170 96" stroke="#233655" stroke-width="2"/>
    <g transform="translate(216 22)">
      <rect width="204" height="72" rx="12" fill="#13213A" stroke="#2A3D5A" stroke-width="2"/>
      <text x="16" y="30" fill="#F5F7FA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">LIFE PICKUP</text>
      <text x="16" y="56" fill="#8DA2BF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">bob + spin</text>
    </g>
    <path d="M 424 58 L 452 58" stroke="#8DA2BF" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(456 22)">
      <rect width="204" height="72" rx="12" fill="#13213A" stroke="#2A3D5A" stroke-width="2"/>
      <text x="16" y="30" fill="#F5F7FA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">ILifeTarget</text>
      <text x="16" y="56" fill="#8DA2BF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">+1 life</text>
    </g>
    <path d="M 664 58 L 692 58" stroke="#8DA2BF" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(696 22)">
      <rect width="204" height="72" rx="12" fill="#13213A" stroke="#2A3D5A" stroke-width="2"/>
      <text x="16" y="30" fill="#F5F7FA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">ENEMY DEFEAT</text>
      <text x="16" y="56" fill="#8DA2BF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">int damage</text>
    </g>
    <path d="M 904 58 L 932 58" stroke="#8DA2BF" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(936 22)">
      <rect width="204" height="72" rx="12" fill="#172A46" stroke="#FFD84D" stroke-width="2"/>
      <text x="16" y="30" fill="#FFD84D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">SCORE MANAGER</text>
      <text x="16" y="56" fill="#D7E2F0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">points + VFX</text>
    </g>
  </g>
  <text x="56" y="538" fill="#8DA2BF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">Obstacle scripts animate local transforms; add a collider and DamageDealer to make them hazardous.</text>
</svg>
