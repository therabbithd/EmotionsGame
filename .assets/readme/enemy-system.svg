<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Enemy system data flow</title>
  <desc id="desc">System map showing EnemyConfigSO feeding EnemySpawner and EnemyPool, with EnemyController driving tween animation, patrol and chase motion, target resolution, damage handling, and recycling back into the pool.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8DA2BF"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1D2C45" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="640" fill="#0B1220"/>
  <rect width="1200" height="640" fill="url(#grid)" opacity="0.4"/>
  <g id="heading" transform="translate(56 48)">
    <text x="0" y="0" fill="#4EA6FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" letter-spacing="3">ENEMY SYSTEM  ·  DATA FLOW</text>
    <text x="0" y="44" fill="#F5F7FA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="700">One config drives waves, reuse, motion and damage.</text>
  </g>
  <g id="row-one" transform="translate(0 132)">
    <g transform="translate(56 0)">
      <rect width="260" height="92" rx="14" fill="#13213A" stroke="#4EA6FF" stroke-width="2"/>
      <text x="22" y="38" fill="#F5F7FA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24">EnemyConfigSO</text>
      <text x="22" y="70" fill="#8DA2BF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">health · score · VFX</text>
    </g>
    <path d="M 324 46 L 454 46" stroke="#8DA2BF" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(470 0)">
      <rect width="260" height="92" rx="14" fill="#13213A" stroke="#4EA6FF" stroke-width="2"/>
      <text x="22" y="38" fill="#F5F7FA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24">EnemySpawner</text>
      <text x="22" y="70" fill="#8DA2BF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">waves · range</text>
    </g>
    <path d="M 738 46 L 868 46" stroke="#8DA2BF" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(884 0)">
      <rect width="260" height="92" rx="14" fill="#13213A" stroke="#4EA6FF" stroke-width="2"/>
      <text x="22" y="38" fill="#F5F7FA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24">EnemyPool</text>
      <text x="22" y="70" fill="#8DA2BF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">prewarm · reuse</text>
    </g>
  </g>
  <g id="controller">
    <path d="M 186 224 L 186 276 L 470 276 L 470 306" fill="none" stroke="#8DA2BF" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 600 224 L 600 306" fill="none" stroke="#8DA2BF" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 1014 224 L 1014 276 L 730 276 L 730 306" fill="none" stroke="#8DA2BF" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(470 312)">
      <rect width="260" height="92" rx="14" fill="#172A46" stroke="#FFD84D" stroke-width="2"/>
      <text x="22" y="38" fill="#FFD84D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24">EnemyController</text>
      <text x="22" y="70" fill="#D7E2F0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">state · score</text>
    </g>
  </g>
  <g id="runtime-lanes">
    <path d="M 600 404 L 600 424" stroke="#8DA2BF" stroke-width="2"/>
    <path d="M 181 424 L 1019 424" stroke="#8DA2BF" stroke-width="2"/>
    <path d="M 181 424 L 181 452" stroke="#8DA2BF" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 461 424 L 461 452" stroke="#8DA2BF" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 741 424 L 741 452" stroke="#8DA2BF" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 1021 424 L 1021 452" stroke="#8DA2BF" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(56 458)">
      <rect width="250" height="78" rx="12" fill="#13213A" stroke="#4EA6FF" stroke-width="2"/>
      <text x="18" y="34" fill="#F5F7FA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">TweenAnimator</text>
      <text x="18" y="62" fill="#8DA2BF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">float + rotation</text>
    </g>
    <g transform="translate(336 458)">
      <rect width="250" height="78" rx="12" fill="#13213A" stroke="#4EA6FF" stroke-width="2"/>
      <text x="18" y="34" fill="#F5F7FA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">EnemyMotion</text>
      <text x="18" y="62" fill="#8DA2BF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">patrol / chase</text>
    </g>
    <g transform="translate(616 458)">
      <rect width="250" height="78" rx="12" fill="#13213A" stroke="#4EA6FF" stroke-width="2"/>
      <text x="18" y="34" fill="#F5F7FA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">TargetResolver</text>
      <text x="18" y="62" fill="#8DA2BF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">assigned or tag</text>
    </g>
    <g transform="translate(896 458)">
      <rect width="250" height="78" rx="12" fill="#13213A" stroke="#FFD84D" stroke-width="2"/>
      <text x="18" y="34" fill="#FFD84D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">TakeDamage</text>
      <text x="18" y="62" fill="#D7E2F0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">defeat → recycle</text>
    </g>
  </g>
  <path d="M 1146 497 L 1172 497 L 1172 178 L 1150 178" fill="none" stroke="#8DA2BF" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  <text x="1162" y="348" fill="#8DA2BF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" transform="rotate(-90 1162 348)" text-anchor="middle">RECYCLE</text>
  <g id="damage-paths" transform="translate(0 560)">
    <text x="56" y="40" fill="#4EA6FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" letter-spacing="2">DAMAGE PATHS</text>
    <rect x="300" y="0" width="256" height="64" rx="12" fill="#13213A" stroke="#2A3D5A" stroke-width="2"/>
    <text x="18" y="27" fill="#F5F7FA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">EnemyController</text>
    <text x="18" y="52" fill="#8DA2BF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">float TakeDamage</text>
    <text x="576" y="40" fill="#8DA2BF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" text-anchor="middle">OR</text>
    <rect x="610" y="0" width="256" height="64" rx="12" fill="#172A46" stroke="#FFD84D" stroke-width="2"/>
    <text x="18" y="27" fill="#FFD84D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">EnemyHealth</text>
    <text x="18" y="52" fill="#D7E2F0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">int damage + score</text>
    <path d="M 874 32 L 912 32" stroke="#8DA2BF" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="920" y="0" width="224" height="64" rx="12" fill="#13213A" stroke="#4EA6FF" stroke-width="2"/>
    <text x="16" y="27" fill="#F5F7FA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">RECYCLE</text>
    <text x="16" y="52" fill="#8DA2BF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">reset on enable</text>
  </g>
</svg>
